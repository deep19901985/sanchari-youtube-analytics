[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sanchari-youtube-analytics"
version = "0.1.0"
description = "Sanchari YouTube Analytics data engineering portfolio"
requires-python = ">=3.11"
dependencies = [
    "google-api-python-client>=2.201,<3",
    "google-auth-oauthlib>=1.5,<2",
    "google-auth-httplib2>=0.4.4,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
